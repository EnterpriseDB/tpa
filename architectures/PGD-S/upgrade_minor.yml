# before running this playbook we have to run the init playbook on all
# hosts and the dynamic_groups playbook, so the group g_update_hosts
# is defined
#
# we would not be here unless all the nodes were running PGD 6 and
# config.yml thought this was a pgd6 cluster

- name: Health check for cluster {{ cluster_dir }}
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:

  - name: set bdr version facts
    include_role: name=postgres/bdr tasks_from=version.yml
    when: >
      "bdr" in role

  - name: Record starting versions
    set_fact:
      starting_postgres_version: "{{ cluster_facts['postgres_version_string'].split()[:2]|join(' ') }}"
      starting_bdr_version: "{{ cluster_facts.databases[bdr_database].bdr.bdr_version }}"
    when: >
      "bdr" in role

  - name: pgd6 config check
    include_role:
      name: test
      tasks_from: bdr6/config.yml
    when: >
      "bdr" in role

  - name: listening ports check
    include_role:
      name: test
      tasks_from: bdr6/ports.yml
    when: >
      "bdr" in role

  - name: Output version information
    debug:
      msg: |
        Starting versions: {{ starting_bdr_version }} on {{ starting_postgres_version }}
    when: >
      "bdr" in role

- name: Set up repositories for {{ cluster_dir }}
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: g_update_hosts
  tasks:

  - name: Configure local-repo, if available
    include_role:
      name: sys/local_repo

  - name: Set up remote repositories
    include_role:
      name: sys/repositories

- name: Pre-upgrade checks for postgres and PGD
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_bdr:&g_update_hosts
  tasks:

  - name: check for installed packages
    include_role:
      name: postgres/pkg
      tasks_from: check-update.yml
    vars:
      upgrade_from: '6'

  - block:
    - name: Get group information
      command: >
        {{ postgres_bin_dir }}/pgd group {{ group_name }} show --summary -o json
      register: pgd_group
      become_user: "{{ postgres_user }}"
      become: yes
      vars:
        group_name: "{{ cluster_name }}"

    - name: Determine write leader
      set_fact:
        write_leader: "{{ pgd_group.stdout|from_json|json_query(leader_query) }}"
      vars:
        leader_query: "[?info=='Write Leader']|[0].value"
    when:
      inventory_hostname == first_bdr_primary

  - name: create temporary group
    add_host:
      name: "{{ hostvars[first_bdr_primary].write_leader }}"
      groups: "g_write_leader"

  - name: Record connection manager endpoint DSN for monitoring
    set_fact:
      cm_endpoint:
        "{{ bdr_node_route_dsn|dbname(bdr_database, user=postgres_user, port=cm_port) }}"
    vars:
      this_node_group:
        "{{ cluster_facts['databases'][bdr_database]['bdr']['local_node']['nodegroup_name'] }}"
      this_node_top_group:
        "{{ cluster_facts['databases'][bdr_database]['bdr']['local_node']['node_topgroup_name'] }}"
      group_port: "{{ (bdr_node_groups|default([]))|selectattr('name','equalto',this_node_group)|map(attribute='options')|selectattr('read_write_port','defined')|map(attribute='read_write_port')|list }}"
      top_port: "{{ (bdr_node_groups|default([]))|selectattr('name','equalto',this_node_top_group)|map(attribute='options')|selectattr('read_write_port','defined')|map(attribute='read_write_port')|list }}"
      cm_port:
        "{{ group_port[0] if group_port|length > 0
            else (top_port[0] if top_port|length > 0
                  else postgres_port|int + 1000) }}"

  # postgres_pkg_check has now been registered - examine its output
  # should we actually verify something about version numbers?

- name: Start monitoring proxy downtime
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_bdr:&g_update_hosts
  tasks:
  - include_role:
      name: test
      tasks_from: proxy-monitor/start.yml
    vars:
      conninfos:
        "{{ (groups['role_bdr']|default([]))
            |difference(groups['role_witness']|default([]))
            |map('extract', hostvars, 'cm_endpoint')
            |list }}"
    when:
      inventory_hostname == first_bdr_primary
      and enable_proxy_monitoring

- name: Update postgres/pgd on chosen instances, except write leader
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_bdr:&g_update_hosts:!g_write_leader
  serial: 1
  tasks:

  - name: Fence off node {{ inventory_hostname }}
    include_role:
      name: postgres/bdr
      tasks_from: fence.yml

  - name: Stop/update/restart Postgres on {{ inventory_hostname }}
    block:
    - include_role: name=postgres/restart
      vars:
        postgres_service_end_state: stopped
    - include_role: name=postgres/update
      vars:
        upgrade_from: '6'

    - include_role: name=postgres/user
    - include_role: name=postgres/config
    - include_role: name=postgres/final

  # We need Raft consensus restored before refreshing cluster_facts:
  # bdr.alter_node_option() (called by fence.yml above) is Raft-replicated,
  # so until this node has rejoined consensus after its restart, its local
  # bdr.node_config may not yet reflect the fence change. Without that, the
  # fact refresh would re-cache the pre-fence value and unfence.yml's
  # idempotency guard would still skip the SQL.
  - name: wait for bdr consensus before unfence
    postgresql_query:
      conninfo: "{{ dsn|dbname(bdr_database) }}"
      query: >
        select s->>'leader_id' != '0' or s->>'leader' != '0' status from bdr.get_raft_status() s;
    register: bdr_raft
    until: bdr_raft.status == true
    retries: 60
    delay: 1
    become_user: "{{ postgres_user }}"
    become: yes

  - name: Refresh cluster facts before unfence
    include_role: name=postgres/facts

  - name: Unfence node {{ inventory_hostname }}
    include_role:
      name: postgres/bdr
      tasks_from: unfence.yml

  - name: listening ports check
    include_role:
      name: test
      tasks_from: bdr6/ports.yml

- name: Update postgres/pgd on write leader
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_bdr:&g_update_hosts:&g_write_leader
  serial: 1
  tasks:

  - name: Fence off node {{ inventory_hostname }}
    include_role:
      name: postgres/bdr
      tasks_from: fence.yml

  - name: Stop/update/restart Postgres on {{ inventory_hostname }}
    block:
    - include_role: name=postgres/restart
      vars:
        postgres_service_end_state: stopped
    - include_role: name=postgres/update
      vars:
        upgrade_from: '6'

    - include_role: name=postgres/user
    - include_role: name=postgres/config
    - include_role: name=postgres/final

  # See the comment on the equivalent task in the non-write-leader play above.
  - name: wait for bdr consensus before unfence
    postgresql_query:
      conninfo: "{{ dsn|dbname(bdr_database) }}"
      query: >
        select s->>'leader_id' != '0' or s->>'leader' != '0' status from bdr.get_raft_status() s;
    register: bdr_raft
    until: bdr_raft.status == true
    retries: 60
    delay: 1
    become_user: "{{ postgres_user }}"
    become: yes

  - name: Refresh cluster facts before unfence
    include_role: name=postgres/facts

  - name: Unfence node {{ inventory_hostname }}
    include_role:
      name: postgres/bdr
      tasks_from: unfence.yml

  - name: listening ports check
    include_role:
      name: test
      tasks_from: bdr6/ports.yml

- name: Stop monitoring proxy downtime
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_bdr:&g_update_hosts
  tasks:
  - include_role:
      name: test
      tasks_from: proxy-monitor/report.yml
    when:
      inventory_hostname == first_bdr_primary
      and enable_proxy_monitoring

# After the last rolling restart, BDR replication slots can still be
# briefly inactive while they re-handshake with the just-updated node.
# Give them a bounded amount of time to come back before we run the
# strict post-upgrade `pgd cluster show --health` check. If the window
# is not enough, fall through so the real check reports the genuine
# problem.
- name: Wait for BDR replication slots to reactivate after upgrade
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_bdr:&g_update_hosts
  tasks:
  - name: Poll bdr.group_replslots_details until all slots are active
    postgresql_query:
      conninfo: "{{ dsn|dbname(bdr_database) }}"
      query: >
        select count(*) = 0 as all_active
        from bdr.group_replslots_details where not active::boolean;
    register: slot_check
    until: slot_check.all_active|default(false)
    retries: 60
    delay: 2
    become_user: "{{ postgres_user }}"
    become: yes
    ignore_errors: yes
    when:
      inventory_hostname == first_bdr_primary

- name: Post-upgrade health checks
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:

  - name: Re-run fact gathering
    include_role: name=postgres/facts
    when: >
      "bdr" in role

  - name: Set bdr version facts
    include_role: name=postgres/bdr tasks_from=version.yml
    when: >
      "bdr" in role

  - name: PGD6 config check
    include_role:
      name: test
      tasks_from: bdr6/config.yml
    when: >
      "bdr" in role

  - name: Output version information
    debug:
      msg: |
        Starting versions: {{ starting_bdr_version }} on {{ starting_postgres_version }}
        Running versions: {{ cluster_facts.databases[bdr_database].bdr.bdr_version }} on {{ cluster_facts['postgres_version_string'].split()[:2]|join(' ') }}
    when: >
      "bdr" in role
