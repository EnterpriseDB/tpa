# To use testing playbook in a cluster:
# 1) Create a symlink to the pgbouncer upgrade testing playbook in the cluster's commands directory
#   ln -s ~/tpa-internal/architectures/lib/upgrade/upgrade-pgbouncer.yml commands/upgrade-pgbouncer.yml
# 2) Run provision after any changes to config.yml, then run the playbook
#   tpaexec provision . && tpaexec upgrade-pgbouncer .

- import_playbook: "{{ tpa_dir }}/architectures/lib/init.yml"
  vars:
    upgrade_in_progress: true
  tags: always

- import_playbook: "{{ tpa_dir }}/architectures/lib/dynamic_groups.yml"
  tags: always

- name: Run clusterwide health check before upgrade
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:  
  - name: Run basic pgbouncer tests
    include_role: 
      name: test
      tasks_from: pgbouncer/basic.yml
    when: "'pgbouncer' in role"

- name: Check if PgBouncer version can be upgraded
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_pgbouncer:&g_update_hosts
  tasks:
  - when: upgrade_selector|strict_selects('pgbouncer') or upgrade_selector|strict_selects('all')
    block:
    - name: Check if PgBouncer can be updated to specified package version  
      include_role:
        name: pgbouncer/pkg
        tasks_from: check-update.yml
      when: pgbouncer_package_version is defined
    
    - set_fact:
        can_upgrade_pgbouncer: "{{ pgbouncer_package_update | default(true) }}"

- name: Upgrade PgBouncer on nodes
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_pgbouncer:&g_update_hosts
  tasks:
  - include_role: name=pgbouncer/update
    when:
    - can_upgrade_pgbouncer
    - upgrade_selector|strict_selects('pgbouncer') or upgrade_selector|strict_selects('all')

- name: Run post-upgrade health check for the cluster
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:  
  - name: Post upgrade basic pgbouncer tests
    include_role: 
      name: test
      tasks_from: pgbouncer/basic.yml
    when: "'pgbouncer' in role"

