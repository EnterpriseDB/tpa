# To use testing playbook in a cluster:
# 1) Create a symlink to the pg-backup-api upgrade testing playbook in the cluster's commands directory
#   ln -s ~/tpa-internal/architectures/lib/upgrade/upgrade-pg-backup-api.yml commands/upgrade-pg-backup-api.yml
# 2) Run provision after any changes to config.yml, then run the playbook
#   tpaexec provision . && tpaexec upgrade-pg-backup-api .

- import_playbook: "{{ tpa_dir }}/architectures/lib/init.yml"
  vars:
    upgrade_in_progress: true
  tags: always

- import_playbook: "{{ tpa_dir }}/architectures/lib/dynamic_groups.yml"
  tags: always

- name: Run clusterwide health check before upgrade
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:  
  - name: Run pg-backup-api checks
    include_role:
      name: test
      tasks_from: pg-backup-api.yml
    when: 
    - "'barman' in role"
    - enable_pg_backup_api|default(false)

- name: Check if PG Backup API version can be upgraded
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_barman:&g_update_hosts
  tasks:
  - when:
    - upgrade_selector|strict_selects('pg-backup-api') or upgrade_selector|strict_selects('all')
    - enable_pg_backup_api|default(false)
    block:
    - name: Check if PG Backup API can be updated to specified package version  
      include_role:
        name: pgbackupapi/pkg
        tasks_from: check-update.yml
      when: pg_backup_api_package_version is defined
    
    - set_fact:
        can_upgrade_pg_backup_api: "{{ pg_backup_api_package_update | default(true) }}"

- name: Upgrade PG Backup API
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_barman:&g_update_hosts
  tasks:
  - include_role: name=pgbackupapi/update
    when: 
    - upgrade_selector|strict_selects('pg-backup-api') or upgrade_selector|strict_selects('all')
    - enable_pg_backup_api|default(false)
    - can_upgrade_pg_backup_api

- name: Run post-upgrade health check for the cluster
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:  
  - name: Run pg-backup-api checks
    include_role:
      name: test
      tasks_from: pg-backup-api.yml
    when: 
    - "'barman' in role"
    - enable_pg_backup_api|default(False)|bool