# To use testing playbook in a cluster:
# 1) Create a symlink to the EFM upgrade testing playbook in the cluster's commands directory
#   ln -s ~/tpa-internal/architectures/lib/upgrade/upgrade-repmgr.yml commands/upgrade-repmgr.yml
# 2) Change 'repmgr_package_version', provision and run the playbook
#   tpaexec provision . && tpaexec upgrade-repmgr .

- import_playbook: "{{ tpa_dir }}/architectures/lib/init.yml"
  vars:
    upgrade_in_progress: true
  tags: always

- import_playbook: "{{ tpa_dir }}/architectures/lib/dynamic_groups.yml"
  tags: always

- name: Run clusterwide health check before upgrade
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:
  - assert:
      that:
        fo_manager == 'repmgr'
      fail_msg:
        This upgrade scenario is for repmgr only

  - name: Check repmgr health
    include_role:
      name: test
      tasks_from: repmgr.yml
    when: 
    - fo_manager == "repmgr"
    - "'postgres' in role"
    - "'primary' in role"
    - "'pem-server' not in role"

- name: Update repository configuration
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: g_update_hosts
  tasks:
  - name: Configure local-repo, if available
    include_role:
      name: sys/local_repo

  - name: Set up repositories
    include_role:
      name: sys/repositories

- name: Check if repmgr version can be upgraded
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_postgres:!role_pem-server
  tasks:
  - when:
    - upgrade_selector|strict_selects('repmgr') or upgrade_selector|strict_selects('all')
    block:
    - name: Check if repmgr can be updated to specified version  
      include_role:
        name: repmgr/pkg
        tasks_from: check-update.yml
      when: repmgr_package_version is defined

    - set_fact:
        can_upgrade_repmgr: "{{ repmgr_package_update | default(true) }}"

- name: Pause repmgr management for the cluster
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: g_chosen_primary
  tasks:
  - include_role:
      name: repmgr/service
      tasks_from: pause.yml

- name: Upgrade repmgr on nodes
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_postgres:!role_pem-server
  serial: 1
  tasks:
  - include_role: name=repmgr/update
    when:
    - upgrade_selector|strict_selects('repmgr') or upgrade_selector|strict_selects('all')
    - can_upgrade_repmgr

- name: Unpause repmgr management for the cluster
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: g_chosen_primary
  tasks:
  - include_role:
      name: repmgr/service
      tasks_from: unpause.yml
    vars:
      # It's important to wait a few seconds after restarting PostgreSQL 
      # on any node before running repmgr service pause/unpause, as the 
      # repmgrd instance on the restarted node will take a second or two 
      # before it has updated its status. Here we let the unpause task
      # know to wait 5 seconds before running if the repmgr upgrade play 
      # is run, since it restarts Postgres on each node.
      delay: "{{ can_upgrade_repmgr | ternary(5, 0) }}"

- name: Run post-upgrade health check for the cluster
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:
  - name: Check repmgr status
    include_role:
      name: test
      tasks_from: repmgr.yml
    when: 
    - fo_manager == "repmgr"
    - "'postgres' in role"
    - "'primary' in role"
    - "'pem-server' not in role"