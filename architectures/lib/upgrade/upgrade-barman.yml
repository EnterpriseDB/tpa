# To use testing playbook in a cluster:
# 1) Create a symlink to the barman upgrade testing playbook in the cluster's commands directory
#   ln -s ~/tpa-internal/architectures/lib/upgrade/upgrade-barman.yml commands/upgrade-barman.yml
# 2) Run provision after any changes to config.yml, then run the playbook
#   tpaexec provision . && tpaexec upgrade-barman .

- import_playbook: "{{ tpa_dir }}/architectures/lib/init.yml"
  vars:
    upgrade_in_progress: true
  tags: always

- import_playbook: "{{ tpa_dir }}/architectures/lib/dynamic_groups.yml"
  tags: always

- name: Run clusterwide health check before upgrade
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:  
  # This will stop the WAL receiver as we do not want any scheduled
  # backup jobs to begin during the upgrade
  - name: Run Barman checks
    include_role:
      name: barman/update
      tasks_from: health-check.yml
    vars:
      target_backups: "{{ barman_backed_nodes|default([]) }}"
    when: >
      'barman' in role

- name: Check if Barman version can be upgraded
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_barman:&g_update_hosts
  tasks:
  - when: >
      upgrade_selector|strict_selects('barman') or upgrade_selector|strict_selects('all')
    block:
    - name: Check if Barman can be updated to specified package version  
      include_role:
        name: barman/pkg
        tasks_from: check-update.yml
      when: barman_package_version is defined
    
    - set_fact:
        can_upgrade_barman: "{{ barman_package_update | default(true) }}"

- name: Upgrade Barman
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_barman:&g_update_hosts
  tasks:
  - include_role: name=barman/update
    vars:
      target_backups: "{{ barman_backed_nodes|default([]) }}"
    when: 
    - upgrade_selector|strict_selects('barman') or upgrade_selector|strict_selects('all')
    - can_upgrade_barman

- name: Run post-upgrade health check for the cluster
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks: 
  - name: Start WAL receiver on barman nodes if Barman version upgrade was skipped.
    include_role:
      name: barman
      tasks_from: server-start-receive-wal.yml
    when: 
    - "'barman' in role"
    - not (can_upgrade_barman|default(false))
  - name: Run barman checks
    include_role: 
      name: test
      tasks_from: barman/basic.yml
    when: >
      'barman' in role
