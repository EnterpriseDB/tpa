# To use testing playbook in a cluster:
# 1) Create a symlink to the pgd-proxy upgrade testing playbook in the cluster's commands directory
#   ln -s ~/tpa-internal/architectures/lib/upgrade/upgrade-pgd-proxy.yml commands/upgrade-pgd-proxy.yml
# 2) Change 'pgd_proxy_package_version', provision and run the playbook
#   pgd_proxy_package_version: '5.8.0*'
#   tpaexec provision . && tpaexec upgrade-pgd-proxy .

- import_playbook: "{{ tpa_dir }}/architectures/lib/init.yml"
  vars:
    upgrade_in_progress: true
  tags: always

- import_playbook: "{{ tpa_dir }}/architectures/lib/dynamic_groups.yml"
  tags: always

- name: Run clusterwide health check before upgrade
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:  
  - name: Check pgd-proxy status
    include_role:
      name: test
      tasks_from: pgd-proxy/basic.yml
    when: >
      'pgd-proxy' in role

- name: Check if pgd-proxy version can be upgraded
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_pgd-proxy:&g_update_hosts
  tasks:
  - when: >
      upgrade_selector|strict_selects('pgd-proxy') or upgrade_selector|strict_selects('all')
    block:
    - name: Define pgd_proxy_package_version if not defined in config.yml
      set_fact:
        pgd_proxy_package_version: "{{ bdr_package_version }}"
      when:
      - pgd_proxy_package_version is not defined
      - bdr_package_version is defined

    - name: Check if pgd-proxy can be updated to specified package version  
      include_role:
        name: pgd_proxy/pkg
        tasks_from: check-update.yml
      when: pgd_proxy_package_version is defined
    
    - set_fact:
        can_upgrade_pgd_proxy: "{{ pgd_proxy_package_update | default(true) }}"

- name: Upgrade pgd-proxy
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_pgd-proxy:&g_update_hosts
  serial: 1
  tasks:
  - include_role: name=pgd_proxy/update
    when: 
    - upgrade_selector|strict_selects('pgd-proxy') or upgrade_selector|strict_selects('all')
    - can_upgrade_pgd_proxy

- name: Run post-upgrade health check for the cluster
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:  
  - name: Check pgd-proxy status
    include_role:
      name: test
      tasks_from: pgd-proxy/basic.yml
    when: >
      'pgd-proxy' in role
