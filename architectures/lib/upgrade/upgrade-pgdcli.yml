# To use testing playbook in a cluster:
# 1) Create a symlink to the pgdcli upgrade testing playbook in the cluster's commands directory
#   ln -s ~/tpa-internal/architectures/lib/upgrade/upgrade-pgdcli.yml commands/upgrade-pgdcli.yml
# 2) Change 'pgdcli_package_version', provision and run the playbook
#   pgdcli_package_version: '5.8.0*'
#   tpaexec provision . && tpaexec upgrade-pgdcli .

- import_playbook: "{{ tpa_dir }}/architectures/lib/init.yml"
  vars:
    upgrade_in_progress: true
  tags: always

- import_playbook: "{{ tpa_dir }}/architectures/lib/dynamic_groups.yml"
  tags: always

- name: Determine BDR version for cluster {{ cluster_dir }}
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_bdr
  tasks:
  - assert:
      that:
        - cluster_facts is defined
      fail_msg: >
        Couldn't perform cluster discovery. Are all nodes running?

  - set_fact:
      bdrdb_major_version:
        "{{ cluster_facts.databases[bdr_database].bdr.bdr_major_version }}"

- name: Run clusterwide health check before upgrade
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:  
  - name: Log pgd-cli diagnostic output
    include_role:
      name: test
      tasks_from: pgd-cli/info.yml
    vars:
      bdr_version: "{{ bdrdb_major_version }}" 
    when:
      - first_bdr_primary is defined
      - inventory_hostname == first_bdr_primary
      - (('bdr' in role  or 'pgd-proxy' in role) and bdrdb_major_version is version('5', '<=')) or 'pgdcli' in role

- name: Check if pgd-cli version can be upgraded
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_bdr:&g_update_hosts
  tasks:
  - when:
    - upgrade_selector|strict_selects('pgdcli') or upgrade_selector|strict_selects('all')
    - (('bdr' in role  or 'pgd-proxy' in role) and bdrdb_major_version is version('5', '<=')) or 'pgdcli' in role
    block:
    - name: Define pdgcli package version if not defined in config.yml
      set_fact:
        pgdcli_package_version: "{{ bdr_package_version }}"
      when:
      - pgdcli_package_version is not defined
      - bdr_package_version is defined

    - name: Check if pgd-cli can be updated to specified package version  
      include_role:
        name: pgdcli/pkg
        tasks_from: check-update.yml
      when: pgdcli_package_version is defined
    
    - set_fact:
        can_upgrade_pgdcli: "{{ pgdcli_package_update | default(true) }}"

- name: Upgrade pgd-cli
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_bdr:&g_update_hosts
  tasks:
  - include_role: name=pgdcli/update
    when: 
    - upgrade_selector|strict_selects('pgd-cli') or upgrade_selector|strict_selects('all')
    - (('bdr' in role  or 'pgd-proxy' in role) and bdrdb_major_version is version('5', '<=')) or 'pgdcli' in role
    - can_upgrade_pgdcli

- name: Run post-upgrade health check for the cluster
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:  
  - name: Log pgd-cli diagnostic output
    include_role:
      name: test
      tasks_from: pgd-cli/info.yml
    vars:
      bdr_version: "{{ bdrdb_major_version }}" 
    when:
      - first_bdr_primary is defined
      - inventory_hostname == first_bdr_primary
      - (('bdr' in role  or 'pgd-proxy' in role) and bdrdb_major_version is version('5', '<=')) or 'pgdcli' in role
