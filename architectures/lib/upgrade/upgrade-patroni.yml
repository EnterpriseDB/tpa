# To use testing playbook in a cluster:
# 1) Create a symlink to the patroni upgrade testing playbook in the cluster's commands directory
#   ln -s ~/tpa-internal/architectures/lib/upgrade/upgrade-patroni.yml commands/upgrade-patroni.yml
# 2) Run provision after any changes to config.yml, then run the playbook
#   tpaexec provision . && tpaexec upgrade-patroni .

- import_playbook: "{{ tpa_dir }}/architectures/lib/init.yml"
  vars:
    upgrade_in_progress: true
  tags: always

- import_playbook: "{{ tpa_dir }}/architectures/lib/dynamic_groups.yml"
  tags: always

- name: Run clusterwide health check before upgrade
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:
  - name: Run Patroni checks
    when: 
    - inventory_hostname == chosen_primary
    - fo_manager == "patroni"
    block:
      - include_role:
          name: test
          tasks_from: patroni/basic.yml
      - include_role:
          name: test
          tasks_from: patroni/pending-restart.yml
      
- name: Check if Patroni version can be upgraded
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_postgres:&g_update_hosts
  tasks:
  - when:
    - upgrade_selector|strict_selects('patroni') or upgrade_selector|strict_selects('all')
    - fo_manager == "patroni"
    block:
    - name: Check if Patroni can be updated to specified package version  
      include_role:
        name: patroni/pkg
        tasks_from: check-update.yml
      when: patroni_package_version is defined

    - set_fact:
        can_upgrade_patroni: "{{ patroni_package_update | default(true) }}"

- name: Put Patroni cluster into maintenance mode before upgrade
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: g_chosen_primary
  tasks:
  - when:
    - upgrade_selector|strict_selects('patroni') or upgrade_selector|strict_selects('all')
    - fo_manager == "patroni"
    - can_upgrade_patroni or can_upgrade_etcd
    block:
    - name: Pause cluster management
      include_role:
        name: patroni/api
        tasks_from: config
      vars:
        body:
          pause: true

    - name: Check Patroni management is paused for the cluster
      assert:
        that: patroni_config_api_output.json.pause|default(false)

- name: Upgrade Patroni
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_postgres:&g_update_hosts
  serial: 1
  tasks:
  - include_role: name=patroni/update
    when: 
    - upgrade_selector|strict_selects('patroni') or upgrade_selector|strict_selects('all')
    - fo_manager == "patroni"
    - can_upgrade_patroni


- name: Take cluster out of maintenance mode after upgrade
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: g_chosen_primary
  tasks:
  - name: Resume cluster management
    include_role:
      name: patroni/api
      tasks_from: config
    vars:
      body:
        pause: false

  - name: Check cluster is resumed
    assert:
      that: not patroni_config_api_output.json.pause

- name: Run post-upgrade health check for the cluster
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:  
  - name: Run Patroni checks
    include_role:
      name: test
      tasks_from: patroni/basic.yml
    when: 
    - inventory_hostname == chosen_primary
    - fo_manager == "patroni"
