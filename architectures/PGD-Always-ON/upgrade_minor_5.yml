# This playbook performs PGD 5 minor version upgrades for PGD-Always-ON
# clusters. It handles upgrades within the PGD 5.x release series only
# (e.g., 5.3→5.4). For BDR 4→PGD 5 major upgrades, see upgrade_major_4to5.yml.
#
# The process is:
# 1. Health checks (pgd-cli diagnostics, pgd-proxy status)
# 2. Pre-upgrade common-component health checks
# 3. Check available upgrades for pgd-proxy and pgd-cli
# 4. Node-by-node postgres/BDR upgrade (fence, stop, update, restart, unfence)
# 5. Upgrade pgd-proxy and pgd-cli packages
# 6. Update BDR v5 configuration and wait for write leaders
# 7. Set up and verify pgd-proxy routing
# 8. Post-upgrade health checks

- name: Run PGD-specific health checks before upgrade
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_bdr
  tasks:
  - name: Log pgd-cli diagnostic output
    include_role:
      name: test
      tasks_from: pgd-cli/info.yml
    vars:
      bdr_version: "{{ bdrdb_major_version }}"
    when:
      inventory_hostname == first_bdr_primary

- name: Check proxy status before upgrade
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_harp-proxy:role_pgd-proxy
  tasks:

  - name: Record pgd-proxy endpoint DSN for monitoring
    set_fact:
      pgd_proxy_endpoint:
        "{{ bdr_node_route_dsn|dbname(bdr_database, user=postgres_user, port=pgd_proxy_options['listen_port']) }}"
    when: >
      'pgd-proxy' in role

  # If a previous BDR 4→5 major upgrade was interrupted after upgrading
  # the data nodes to v5, but before replacing harp-proxy with pgd-proxy,
  # a subsequent upgrade will (correctly) think it's a minor version
  # upgrade, but harp-proxy may still be running.

  - set_fact:
      harp_proxy_still_running: false

  - name: Check for unreplaced harp-proxy processes
    when: >
      'harp-proxy' in role
      and 'pgd-proxy' in role
    block:
    - name: Check if harp-proxy is running
      command: pgrep harp-proxy
      register: harp_proxy_check
      ignore_errors: yes

    - set_fact:
        harp_proxy_still_running: "{{ harp_proxy_check.stdout != '' }}"

  - name: Check harp-proxy status
    include_role:
      name: test
      tasks_from: harp-proxy/basic.yml
    when: >
      'harp-proxy' in role
      and harp_proxy_still_running

  - name: Check pgd-proxy status
    include_role:
      name: test
      tasks_from: pgd-proxy/basic.yml
    when: >
      'pgd-proxy' in role
      and not harp_proxy_still_running

# Ascertain the status/health of PgBouncer, pg-backup-api and Barman BEFORE upgrade
# If any fail, the upgrade playbook will bail out.
# NOTE: The Barman WAL-receiver is stopped after this play is run,
# as we do not want new backup jobs to start mid-upgrade.
- name: Import pre-upgrade common-component health-checks
  import_playbook: "{{ tpa_dir }}/architectures/common/playbooks/pre_upgrade_checks.yml"

- name: Start monitoring proxy downtime
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_bdr
  tasks:
  - set_fact:
      any_harp_proxy_still_running:
        "{{ groups['role_harp-proxy']|default([])
            |map('extract', hostvars, 'harp_proxy_still_running')
            |select('defined')
            |contains(true) }}"

  - include_role:
      name: test
      tasks_from: proxy-monitor/start.yml
    vars:
      conninfos:
        "{{ groups['role_pgd-proxy']|default([])
            |map('extract', hostvars, 'pgd_proxy_endpoint')
            |list }}"
    when:
      inventory_hostname == first_bdr_primary
      and enable_proxy_monitoring
      and not any_harp_proxy_still_running

- name: Check if pgd-proxy version can be upgraded
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_pgd-proxy:&g_update_hosts
  tasks:
  - when: >
      upgrade_selector|strict_selects('pgd-proxy') or upgrade_selector|strict_selects('all')
    block:
    - name: Define pgd_proxy_package_version if not defined in config.yml
      set_fact:
        pgd_proxy_package_version: "{{ bdr_package_version }}"
      when:
      - pgd_proxy_package_version is not defined
      - bdr_package_version is defined

    - name: Check if pgd-proxy can be updated to specified package version
      include_role:
        name: pgd_proxy/pkg
        tasks_from: check-update.yml
      when:
      - pgd_proxy_package_version is defined

    - set_fact:
        can_upgrade_pgd_proxy: "{{ pgd_proxy_package_update | default(true) }}"

- name: Check if pgd-cli version can be upgraded
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_bdr:role_pgdcli:&g_update_hosts
  tasks:
  - when:
    - upgrade_selector|strict_selects('pgdcli') or upgrade_selector|strict_selects('all')
    - (('bdr' in role  or 'pgd-proxy' in role) and bdrdb_major_version is version('5', '<=')) or 'pgdcli' in role
    block:
    - name: Define pgdcli package version if not defined in config.yml
      set_fact:
        pgdcli_package_version: "{{ bdr_package_version }}"
      when:
      - pgdcli_package_version is not defined
      - bdr_package_version is defined

    - name: Check if pgd-cli can be updated to specified package version
      include_role:
        name: pgdcli/pkg
        tasks_from: check-update.yml
      when: pgdcli_package_version is defined

    - set_fact:
        can_upgrade_pgdcli: "{{ pgdcli_package_update | default(true) }}"

# Now that we're convinced the cluster is in a reasonable initial state,
# we start the update process one by one on the instances.
- name: Update postgres on instances in cluster {{ cluster_dir }}
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_postgres:&g_update_hosts:!role_pem-server
  serial: 1
  tasks:
  - name: Fence the node before upgrade
    include_role:
      name: postgres/bdr
      tasks_from: fence.yml
    vars:
      failover_manager: pgd
    when:
      - "'bdr' in role"
      - inventory_hostname in first_bdr_primary_candidates

  - include_role:
      name: pgd_proxy/dbuser
      apply:
        tags: [pgd-proxy, dbuser]
    when:
      failover_manager == 'pgd'
      and 'bdr' in role
      and 'pem-server' not in role

  - name: Stop/update/restart Postgres on {{ inventory_hostname }}
    when:
    - upgrade_selector|strict_selects('postgres') or upgrade_selector|strict_selects('all')
    - can_upgrade_postgres
    block:
    - include_role: name=postgres/restart
      vars:
        postgres_service_end_state: stopped
    - include_role: name=postgres/update
      vars:
        upgrade_from: '5'
    - include_role: name=postgres/user
    - include_role: name=postgres/config
    - include_role: name=postgres/final

  - set_fact:
      any_harp_proxy_still_running:
        "{{ groups['role_harp-proxy']|default([])
            |map('extract', hostvars, 'harp_proxy_still_running')
            |select('defined')
            |contains(true) }}"

  - name: Create symlink for harp-manager to connect to database
    file:
      name: "/var/run/postgresql/.s.PGSQL.{{ postgres_port }}"
      src: "/var/run/edb-pge/.s.PGSQL.{{ postgres_port }}"
      state: "link"
      force: true
    when: >
      postgres_flavour == 'edbpge'
      and 'bdr' in role
      and any_harp_proxy_still_running

  # We need Raft consensus restored before refreshing cluster_facts:
  # bdr.alter_node_option() (called by fence.yml above) is Raft-replicated,
  # so until this node has rejoined consensus after its restart, its local
  # bdr.node_config may not yet reflect the fence change. Without that, the
  # fact refresh would re-cache the pre-fence value and unfence.yml's
  # idempotency guard would still skip the SQL.
  - name: Wait for bdr nodes to reach consensus before unfence
    postgresql_query:
      conninfo: "{{ dsn|dbname(bdr_database) }}"
      query: >
        select s->>'leader_id' != '0' or s->>'leader' != '0' status from bdr.get_raft_status() s;
    register: bdr_raft
    until: bdr_raft.status == true
    retries: 60
    delay: 1
    become_user: "{{ postgres_user }}"
    become: yes
    when:
    - "'bdr' in role"
    - "'replica' not in role"

  - name: Refresh cluster facts before unfence
    include_role: name=postgres/facts
    when:
      - "'bdr' in role"
      - inventory_hostname in first_bdr_primary_candidates

  - name: Unfence the node after upgrade
    include_role:
      name: postgres/bdr
      tasks_from: unfence.yml
    vars:
      failover_manager: pgd
    when:
      - "'bdr' in role"
      - inventory_hostname in first_bdr_primary_candidates

  # Ansible won't stop execution if a host becomes unreachable, despite
  # the any_errors_fatal setting. We must detect that situation and fail
  # so that we don't proceed to the next host if something went wrong in
  # upgrading this one.

  - name: Fail if any host became unreachable
    assert:
      msg: "One or more hosts are no longer reachable"
      that:
        ansible_play_hosts == ansible_play_hosts_all

- name: Upgrade pgd-proxy
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_pgd-proxy:&g_update_hosts
  serial: 1
  tasks:
  - include_role: name=pgd_proxy/update
    when:
    - upgrade_selector|strict_selects('pgd-proxy') or upgrade_selector|strict_selects('all')
    - can_upgrade_pgd_proxy

- name: Upgrade pgd-cli
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_bdr:role_pgdcli:&g_update_hosts
  tasks:
  - include_role: name=pgdcli/update
    when:
    - upgrade_selector|strict_selects('pgdcli') or upgrade_selector|strict_selects('all')
    - (('bdr' in role  or 'pgd-proxy' in role) and bdrdb_major_version is version('5', '<=')) or 'pgdcli' in role
    - can_upgrade_pgdcli

- name: Update BDR v5-specific configuration
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_bdr
  tasks:
  - include_role:
      name: postgres/bdr
      tasks_from: update.yml

  - name: Log pgd-cli diagnostic output after BDR group configuration
    include_role:
      name: test
      tasks_from: pgd-cli/info.yml
    when:
    - inventory_hostname == first_bdr_primary
    - upgrade_selector|strict_selects('pgdcli') or upgrade_selector|strict_selects('all')

  - name: Wait for write leader elections to complete
    command: >
      {{ pgdcli_bin }} show-groups -o json
    register: pgd_show_groups
    become_user: "{{ postgres_user }}"
    become: yes
    vars:
      group_info: "{{ (pgd_show_groups.stdout or '[]')|from_json }}"
      leaderless_routing_groups: >-
        {{ group_info
           |json_query("[?enable_proxy_routing && write_lead == '']") }}
      election_timeout: >-
        {{ cluster_facts.pg_settings["bdr.raft_global_election_timeout"]
           |default(6000) }}
    until:
      pgd_show_groups is not successful
      or leaderless_routing_groups is empty
    retries: "{{ (4*(election_timeout|int)/1000)|int }}"
    delay: 1
    when:
    - inventory_hostname == first_bdr_primary
    - upgrade_selector|strict_selects('pgdcli') or upgrade_selector|strict_selects('all')

- name: Update proxies in cluster {{ cluster_dir }}
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_harp-proxy:role_pgd-proxy:&g_update_hosts
  tasks:
  - name: Set up pgd-proxy
    include_role:
      name: pgd_proxy
    when: >
      'pgd-proxy' in role

  - name: Stop harp-proxy
    service:
      name: harp-proxy
      state: stopped
    when: >
      'harp-proxy' in role
      and harp_proxy_still_running

  - name: Start pgd-proxy
    service:
      name: pgd-proxy
      state: started
    when: >
      'pgd-proxy' in role

  - name: Log pgd-cli diagnostic output
    block:
    - include_role:
        name: test
        tasks_from: pgd-cli/info.yml
    when: >
      'pgd-proxy' in role
    vars:
      with_user: "{{ pgd_proxy_user }}"
    run_once: true

  - name: Check pgd-proxy status
    include_role:
      name: test
      tasks_from: pgd-proxy/basic.yml
    when: >
      'pgd-proxy' in role

- name: Stop monitoring proxy downtime
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_bdr
  tasks:
  - include_role:
      name: test
      tasks_from: proxy-monitor/report.yml
    when:
      inventory_hostname == first_bdr_primary
      and enable_proxy_monitoring
      and not any_harp_proxy_still_running

- name: Run PGD-specific health checks after upgrade
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:
  - name: Run pgd-proxy checks
    include_role:
      name: test
      tasks_from: pgd-proxy/basic.yml
    when: >
      'pgd-proxy' in role

  - name: Log pgd-cli diagnostic output
    include_role:
      name: test
      tasks_from: pgd-cli/info.yml
    vars:
      bdr_version: "{{ bdrdb_major_version }}"
    when:
      - first_bdr_primary is defined
      - inventory_hostname == first_bdr_primary
      - (('bdr' in role  or 'pgd-proxy' in role) and bdrdb_major_version is version('5', '<=')) or 'pgdcli' in role
