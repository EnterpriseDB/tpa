- summary: Add an option to preserve ansible.log across deprovision instead of deleting it
  description: |
    tpaexec deprovision always deleted the cluster directory's ansible.log
    along with other generated files. Setting ansible_log_rotate: true at the
    top level of config.yml now rotates it instead (ansible.log.N files shift
    up by one, and the current log becomes ansible.log.0), which is useful
    when repeatedly provisioning and deprovisioning the same cluster
    directory during development. Default behavior is unchanged.
  type: minor_change
  jira_tickets:
  - TPA-1646
