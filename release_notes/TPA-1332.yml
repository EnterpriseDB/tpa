- summary: Reject unsupported Postgres 13 for PGD 6 clusters
  description: |
    Updated `tpaexec configure` to explicitly reject configurations combining
    Postgres 13 with PGD 6. As Postgres 13 is not supported by PGD 6, this
    check prevents users from proceeding with incompatible setups that would
    otherwise fail later during the deployment phase.
  # Possible types: notable_change, minor_change, bugfix or breaking_change
  type: minor_change
  # At least one between jira_tickets or support_tickets must be defined. You
  # can define both if you want
  # You must have at least one list item in each *_tickets section that is
  # defined
  jira_tickets:
  - TPA-1332
