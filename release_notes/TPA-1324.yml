- summary: Support running TPA on RHEL 10
  description: |
    The TPA controller can now be a system running RHEL 10 or an equivalent
    OS (Rocky Linux, AlmaLinux, or Oracle Linux 10). On these systems, the
    system python packages (python 3.12) can be used.
  # Possible types: notable_change, minor_change, bugfix or breaking_change
  type: notable_change
  # At least one between jira_tickets or support_tickets must be defined. You
  # can define both if you want
  # You must have at least one list item in each *_tickets section that is
  # defined
  jira_tickets:
  - TPA-1324
