- summary: Default to "enterprise" repository for PGD-S architecture
  description: |
    A cluster configured to use the PGD-S architecture now defaults to
    the "enterprise" repository not the "postgres_distributed" repository.
    Thus the default repositories now match the required subscription levels.
  # Possible types: notable_change, minor_change, bugfix or breaking_change
  type: minor_change
  # At least one between jira_tickets or support_tickets must be defined. You
  # can define both if you want
  # You must have at least one list item in each *_tickets section that is
  # defined
  jira_tickets:
  - TPA-1333
