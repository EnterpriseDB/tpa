- summary: Prevent duplicate `bdr_node_groups` in PGD-X configuration
  description: |
    Resolved an issue where specifying Connection Manager port options during
    `tpaexec configure` for PGD-X clusters resulted in duplicate
    `bdr_node_groups` entries in `config.yml`. The configuration logic now
    correctly handles these options to ensure a clean and valid cluster
    definition.
  # Possible types: notable_change, minor_change, bugfix or breaking_change
  type: bugfix
  # At least one between jira_tickets or support_tickets must be defined. You
  # can define both if you want
  # You must have at least one list item in each *_tickets section that is
  # defined
  jira_tickets:
  - TPA-1331
