- summary: Improve ssh configuration, supporting jump host
  description: |
    TPA now fully populates its generated ssh_config with all the options
    needed by ansible, and ansible uses the config instead of adding options to
    the command line.

    The configuration can now include a jump host, which will therefore be
    automatically used when deploying.
  # Possible types: notable_change, minor_change, bugfix or breaking_change
  type: minor_change
  # At least one between jira_tickets or support_tickets must be defined. You
  # can define both if you want
  # You must have at least one list item in each *_tickets section that is
  # defined
  jira_tickets:
  - TPA-934
