name: Automation for GitHub -> Jira (internal)

on:
  create:

  pull_request:
    types:
      - opened # If a PR was already opened in "ready for review" state
      - ready_for_review # If a draft PR was marked as "ready for review"
      - review_requested # If a review was requested again on a PR
      - closed # If a PR was closed/merged

  pull_request_review:
    types:
      - submitted

  pull_request_review_comment:
    types:
      - created

  # issue_comment:
  #   types:
  #     - created

jobs:
  # When a branch which name starts with 'dev/TPA-*' is created in GitHub, send
  # a webhook to Jira to move the status of the corresponding ticket to 'In
  # Progress'.
  on-github-branch-create-move-jira-ticket:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'create' &&
      github.event.ref_type == 'branch' &&
      startsWith(github.event.ref, 'dev/TPA-')
    steps:
      - name: Send webhook to Jira
        run: |
          curl -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Automation-Webhook-Token: ${WEBHOOK_SECRET}" \
            -d "${WEBHOOK_PAYLOAD}"
        env:
          WEBHOOK_URL: ${{ secrets.JIRA_BRANCH_CREATED_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.JIRA_BRANCH_CREATED_WEBHOOK_SECRET }}
          WEBHOOK_PAYLOAD: ${{ toJSON(github.event) }}

  # When a PR from a dev branch is "ready for review" in GitHub, send a webhook
  # to Jira to move the status of the corresponding ticket to 'Ready for
  # Review'.
  on-github-pr-ready-for-review-move-jira-ticket:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-ready-for-review
      cancel-in-progress: false
    if: >
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'dev/TPA-') &&
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false
    steps:
      - name: Send webhook to Jira
        run: |
          curl -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Automation-Webhook-Token: ${WEBHOOK_SECRET}" \
            -d "${WEBHOOK_PAYLOAD}"
        env:
          WEBHOOK_URL: ${{ secrets.JIRA_PR_READY_FOR_REVIEW_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.JIRA_PR_READY_FOR_REVIEW_WEBHOOK_SECRET }}
          WEBHOOK_PAYLOAD: ${{ toJSON(github.event) }}

  # When a review requesting changes is submitted to a PR from a dev branch in
  # GitHub, send a webhook to Jira to move the status of the corresponding
  # ticket to 'Required Changes'.
  on-github-pr-review-request-changes-move-jira-ticket:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request_review' &&
      startsWith(github.event.pull_request.head.ref, 'dev/TPA-') &&
      github.event.pull_request.draft == false &&
      github.event.review.state == 'changes_requested'
    steps:
      - name: Send webhook to Jira
        run: |
          curl -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Automation-Webhook-Token: ${WEBHOOK_SECRET}" \
            -d "${WEBHOOK_PAYLOAD}"
        env:
          WEBHOOK_URL: ${{ secrets.JIRA_PR_REVIEW_REQUEST_CHANGES_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.JIRA_PR_REVIEW_REQUEST_CHANGES_WEBHOOK_SECRET }}
          WEBHOOK_PAYLOAD: ${{ toJSON(github.event) }}

  # When a PR from a dev branch is merged in GitHub, send a webhook to Jira
  # to move the status of the corresponding ticket to 'Ready for Release'.
  on-github-pr-merge-move-jira-ticket:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'dev/TPA-') &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    steps:
      - name: Send webhook to Jira
        run: |
          curl -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Automation-Webhook-Token: ${WEBHOOK_SECRET}" \
            -d "${WEBHOOK_PAYLOAD}"
        env:
          WEBHOOK_URL: ${{ secrets.JIRA_PR_MERGED_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.JIRA_PR_MERGED_WEBHOOK_SECRET }}
          WEBHOOK_PAYLOAD: ${{ toJSON(github.event) }}


