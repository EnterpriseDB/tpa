---
# Generated by the foundation-security scan migration. Owner: edit the marked lines, then merge.
name: Foundation-Security/Security Scan

on:
  push:
    tags:
      - "**"
    branches:
      - "*main*"
      - "*master*"
      - "*STABLE*"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "**"
  merge_group:   # merge queue runs: the scan jobs report as skipped, which passes required checks
  schedule:
    - cron: "0 3 * * *"   # kept from the old workflow
  workflow_dispatch:
    inputs:
      release-phase:
        description: "Black Duck release phase. Only a manual run may request release-candidate."
        required: true
        type: choice
        options:
          - development
          - release-candidate
        default: development
      repository:
        description: "Repository to scan (org/repo). Defaults to this repository."
        required: false
      ref:
        description: "Branch, tag or ref to scan. Defaults to the current ref."
        required: false
      version:
        description: "Version name to display. Defaults to ref."
        required: false
      product-track:
        description: "Product track. Optional, Watchtower picks it from the product's track patterns."
        required: false

jobs:
  security-scan:
    name: Security Scan
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      id-token: write
      contents: read
      packages: read
    uses: EnterpriseDB/foundation-security/.github/workflows/security-scan-reusable.yml@stable
    with:
      release-phase: ${{ inputs.release-phase || 'development' }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version }}
      product-track: ${{ inputs.product-track }}
    secrets: inherit
