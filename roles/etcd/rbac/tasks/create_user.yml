#
# Creates a user in etcd if it does not already exist.
#
# This task is idempotent and designed to be reusable.
#
# Expects the following variable to be defined:
#
# * username: (string) The username to create.
# * password: (string) The password for the user.
#
# Uses the following facts, which should be set beforehand:
# - etcdctl_options: (string) Pre-formatted options for etcdctl,
#                    including endpoints, SSL, and auth credentials.

- name: "Check if etcd user '{{ username }}' already exists"
  command:
    cmd: "etcdctl user get {{ username }} {{ etcdctl_options }}"
  environment:
    ETCDCTL_API: 3
  register: user_check_result
  changed_when: false
  # We expect either rc 0 (user exists) or rc 1 with 'user name not found' in stderr
  # (user does not exist). Anything else is a failure.
  failed_when: >
    user_check_result.rc == 1
    and 'user name not found' not in user_check_result.stderr

- name: "Create the etcd user '{{ username }}'"
  when: >
    user_check_result.rc == 1
    and 'user name not found' in user_check_result.stderr
  command:
    cmd: "etcdctl user add {{ username }}:{{ password }} {{ etcdctl_options }}"
  environment:
    ETCDCTL_API: 3
  changed_when: true
