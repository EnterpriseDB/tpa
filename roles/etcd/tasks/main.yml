# Set up etcd facts (SSL paths, endpoints, etcdctl options) before configuration.
# This was moved here from roles/init/tasks/main.yml (commit 10e27e1e83c7) because
# it requires Python (uses stat module) which is installed by sys/bootstrap before
# this role runs.
- include_role:
    name: etcd/facts
  when: >
    'etcd' in role

# The etcd-server package supplied on debian installs and starts a
# default systemd service and data storage location which conflicts
# with how we want it. To ensure that the configuration is correct
# we put this in place before installing the packages.

- include_role:
    name: etcd/config
  when: >
    'etcd' in role
    and task_selector|permits('config')

- include_role:
    name: etcd/service
  when: >
    task_selector|permits('service')

- include_role:
    name: etcd/pkg
  when: >
    task_selector|permits('pkg')
