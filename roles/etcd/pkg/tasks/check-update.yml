- include_tasks: list-packages.yml
  vars:
    list_varname: _all_etcd_packages

- name: Check if we can install the desired etcd packages
  include_role:
    name: pkg/install
  vars:
    package_list_name: "etcd packages"
    package_list: "{{ _all_etcd_packages }}"
    check_install_only: yes
    result_varname: etcd_pkg_check

- assert:
    that: etcd_pkg_check is successful
    fail_msg: >
      Some packages are missing or the 'etcd_package_version' specified in 'config.yml' cannot be satisfied.

- debug:
    msg: "The desired 'etcd_package_version' or higher is already installed. etcd upgrade tasks will be skipped on '{{ inventory_hostname }}'."
  when: 
  - etcd_pkg_check is successful
  - etcd_pkg_check.changed is false

- set_fact:
    etcd_package_update: "{{
      etcd_pkg_check is defined 
      and etcd_pkg_check is successful 
      and etcd_pkg_check.changed is true
    }}"