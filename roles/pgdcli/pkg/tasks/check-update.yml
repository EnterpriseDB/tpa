- include_tasks: list-packages.yml
  vars:
    list_varname: _all_pgdcli_packages

- name: Check if we can install the desired pgdcli packages
  include_role:
    name: pkg/install
  vars:
    package_list_name: "pgdcli packages"
    package_list: "{{ _all_pgdcli_packages }}"
    check_install_only: yes
    result_varname: pgdcli_pkg_check

- assert:
    that: pgdcli_pkg_check is successful
    fail_msg: >
      Some packages are missing or the 'pgdcli_package_version' specified in 'config.yml' cannot be satisfied.

- debug:
    msg: "The desired 'pgdcli_package_version' or higher is already installed. pgd-cli upgrade tasks will be skipped on '{{ inventory_hostname }}'."
  when:
  - pgdcli_pkg_check is successful
  - pgdcli_pkg_check.changed is false

- set_fact:
    pgdcli_package_update: "{{
      pgdcli_pkg_check is defined 
      and pgdcli_pkg_check is successful 
      and pgdcli_pkg_check.changed is true
    }}"