- include_role: name=pkg/add_to_list
  vars:
    list_contents: "{{
        pem_server_v10_required_packages|packages_for(ansible_os_family)
      }}"
    list_varname: _v10_pem_server_packages

- include_role: name=pkg/install
  vars:
    package_list_name: "Required PEM v10 server packages"
    package_list: "{{ _v10_pem_server_packages }}"
