- include_role:
    name: pem/server/pkg
  vars:
    _allowerasing: "{{ ansible_os_family == 'RedHat' }}"
    _allow_package_upgrades: yes

- include_role:
    name: pem/server/facts

- include_role:
    name: pem/server/pkg
    tasks_from: v10-packages.yml
  vars:
    _allowerasing: "{{ ansible_os_family == 'RedHat' }}"
    _allow_package_upgrades: yes
  when: pem_is_v10_or_higher | default(true)

# We check for web server package updates here, due to differences 
# between PEM v10.4.0+ and earlier versions

- include_role:
    name: pem/server/pkg
    tasks_from: webserver-packages.yml
  when:
    - task_selector|selects('pem-server', 'pem-webserver', 'pkg')

# This gate must stay in lockstep with the webserver-packages.yml include above:
# configure_httpd_module.yml reads the pem_server_modwsgi_package_resolved fact
# that webserver-packages.yml sets, so the (pkg-gated) producer must run whenever
# this consumer does. Hence 'pkg' here even though it's a config role — without
# it, an upgrade that excludes pkg would run this with the fact undefined and
# silently fail to enable the wsgi module.
- include_role:
    name: pem/server/config/webserver
  when:
    - task_selector|selects('pem-server', 'pem-webserver', 'pkg')

