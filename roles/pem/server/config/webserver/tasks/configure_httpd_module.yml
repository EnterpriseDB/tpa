# Enable the edb-python3-mod-wsgi module *before* any other apache2_module task
# below, using a2dismod/a2enmod directly rather than the apache2_module module.
#
# apache2_module runs `apache2ctl -M` to read the current module state before it
# does anything — even for state=absent. That parses the whole config. On upgrade
# the existing sites-enabled/edb-pem.conf already references WSGIScriptAlias while
# the previous wsgi package has just been removed (see pem/server/pkg
# webserver-packages.yml), so that parse fails with "Invalid command
# 'WSGIScriptAlias'" before the module can be touched — which is why enabling wsgi
# via apache2_module here (even first) cannot work: the pre-read fails too.
#
# a2dismod/a2enmod only manage the mods-enabled symlinks and never run a config
# test, so they succeed while the config is temporarily invalid. Once the symlink
# exists mod_wsgi loads on the next parse, making the config valid for the
# apache2_module add-on tasks below. The service restart that activates everything
# stays at the end of this file.
- name: Enable edb-python3-mod-wsgi
  block:
    - name: Disable the generic mod_wsgi
      command: a2dismod -q wsgi
      register: a2dismod_wsgi
      changed_when: a2dismod_wsgi.rc == 0
      # Tolerate the module already being gone (e.g. its package was just
      # removed on upgrade) but still surface any other failure.
      failed_when: >
        a2dismod_wsgi.rc != 0
        and 'does not exist' not in a2dismod_wsgi.stderr

    - name: Enable edb-python3-mod-wsgi
      command: a2enmod -q edb-python3-mod-wsgi
      register: a2enmod_wsgi
      changed_when: "'Enabling' in a2enmod_wsgi.stdout"
  when: >
    ansible_os_family == 'Debian'
    and pem_version is version('9.0','>=')
    and 'edb-python' in (pem_server_modwsgi_package_resolved | default(''))

- name: "Configure Add-ons for {{ pem_web_server_name[ansible_os_family] }}..."
  block:
    - name: Check the mod_ssl
      command: /usr/sbin/a2query -m ssl
      register: mod_ssl
      ignore_errors: true
      no_log: true

    - name: Check the mod_gnutls
      command: /usr/sbin/a2query -m gnutls
      register: mod_gnutls
      ignore_errors: true
      no_log: true

    - name: Disabling mod_gnutls as both mod_ssl and mod_gnutls are enabled
      apache2_module:
        state: absent
        name: gnutls
      when: mod_gnutls.rc == 0 and mod_ssl.rc == 0

    - name: Enabling mod_ssl as both mod_ssl and mod_gnutls are disabled
      apache2_module:
        state: present
        name: ssl
      when: mod_gnutls.rc != 0 and mod_ssl.rc != 0

    - name: Enabling mod_socache_dbm
      apache2_module:
        state: present
        name: socache_dbm

    - name: Enabling mod_rewrite
      apache2_module:
        state: present
        name: rewrite
  when: ansible_os_family == 'Debian'

- name: "Configure apache for SUSE"
  block:
    - name: Enable mod_rewrite
      apache2_module:
        state: present
        name: rewrite

    - name: Enable mod_access_compat
      apache2_module:
        state: present
        name: access_compat
  when: ansible_os_family == 'SUSE'

- name: "Restart httpd service - {{ pem_web_server_service_name[ansible_os_family] }}"
  service:
      name: "{{ pem_web_server_service_name[ansible_os_family] }}"
      state: restarted
  when: >
    ansible_os_family == 'Debian'
    and pem_version is version('9.0','>=')
    and 'edb-python' in (pem_server_modwsgi_package_resolved | default(''))
    and task_selector|permits('service', 'restart')
