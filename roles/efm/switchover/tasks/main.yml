- name: Include EFM config defaults
  include_vars:
    name: _efm_config_defaults
    file: "{{ tpa_dir }}/roles/efm/config/defaults/main.yml"

- name: Apply EFM config defaults for variables not already defined
  set_fact:
    efm_bind_by_hostname: "{{ efm_bind_by_hostname|default(_efm_config_defaults.efm_bind_by_hostname) }}"
    efm_cluster_status_retries: "{{ efm_cluster_status_retries|default(_efm_config_defaults.efm_cluster_status_retries) }}"
    efm_cluster_status_retry_delay: "{{ efm_cluster_status_retry_delay|default(_efm_config_defaults.efm_cluster_status_retry_delay) }}"

- name: Check that required argument `target` was supplied
  assert:
    that:
      target is defined
    fail_msg:
      Please define the parameter "target" host to become the new primary

- name: Target specific checks
  when: >
    inventory_hostname == target
  block:
  - name: Ensure target is a postgres server
    assert:
      msg: "Switchover target is not a postgres server: {{ target }}"
      that:
        - "'postgres' in role"
  - name: Ensure target is not already a primary
    assert:
      msg: "Switchover target is already a primary: {{ target }}"
      that:
        - target not in groups['primary']
    when: >
      not managed_switchover

  - name: Ensure that there is only one primary
    assert:
      msg: "Expected only one primary, but found: {{ groups['primary']|join(', ') }}"
      that:
        - groups['primary']|difference(groups['role_pem-server']|default([]))|length == 1

  - name: Ensure that the new target is not a cascading replica
    assert:
      msg: "The new target cannot be promoted as it is a cascading replica."
      that:
        - upstream is not defined or upstream is defined and upstream in groups['primary']
    when: >
      not managed_switchover

- name: Ensure efm_bind_by_hostname is handled
  set_fact:
    efm_identity: "{{ efm_bind_by_hostname|default(false)|ternary(inventory_hostname,ip_address) }}"
  when:
      role|intersect(['primary','replica'])

- name: Run on target only tasks
  when: >
    inventory_hostname == target
  block:
  - command: >
      {{ efm_bin_dir }}/efm set-priority {{ cluster_name }} {{ efm_identity }} 1

  - name: Wait for target to catch up with replication
    command: >
      {{ efm_bin_dir }}/efm cluster-status-json {{ cluster_name }}
    register: pre_switchover_status
    retries: "{{ efm_cluster_status_retries }}"
    delay: "{{ efm_cluster_status_retry_delay }}"
    until: >
      pre_switchover_status is success and
      efm_lsn == primary_lsn
    vars:
      efm_status: "{{ pre_switchover_status.stdout|from_json }}"
      efm_node: "{{ efm_status.nodes[efm_identity] }}"
      # EFM 5 renamed xlog/xlogReceive to lsn/lsnReceive in cluster-status-json output.
      lsn_key: "{{ efm_version is version('5', '>=') | ternary('lsn', 'xlog') }}"
      efm_lsn: "{{ efm_node[lsn_key] }}"
      primary_node: "{{ (efm_status.nodes | dict2items | selectattr('value.type', 'equalto', 'Primary') | list | first).value }}"
      primary_lsn: "{{ primary_node[lsn_key] }}"
    changed_when: false
    become_user: "{{ postgres_user }}"
    become: yes

  - name: Perform switchover with EFM to {{ target }}
    command: >
      {{ efm_bin_dir }}/efm promote {{ cluster_name }} -switchover

  - name: Display cluster status
    command: >
      {{ efm_bin_dir }}/efm cluster-status-json {{ cluster_name }}
    register: cluster_status
    retries: "{{ efm_cluster_status_retries }}"
    delay: "{{ efm_cluster_status_retry_delay }}"
    until: >
      cluster_status is success and
      (cluster_status.stdout|from_json).nodes[efm_identity].type == 'Primary'
    changed_when: false
    become_user: "{{ postgres_user }}"
    become: yes

  - name: Show status of cluster after switchover
    debug:
      var: efm_status
    vars:
      efm_status: "{{cluster_status.stdout|from_json}}"

  - name: Ensure target is now Primary
    assert:
      that:
        efm_status.nodes[efm_identity].type == 'Primary'
    vars:
      efm_status: "{{ cluster_status.stdout|from_json }}"

- name: Update upstream_primary and efm.properties to reflect switchover
  when:
  - "'primary' in role or 'replica' in role"
  - "'pem-server' not in role"
  block:
  - name: Set {{ target }} as upstream_primary
    set_fact:
      upstream_primary: "{{ target }}"

  - name: Reconfigure efm
    include_role:
      name: efm/config

  - include_role:
      name: efm/restart
