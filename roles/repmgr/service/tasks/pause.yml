- name: Pause repmgr
  command: >
    {{ postgres_bin_dir }}/repmgr service pause -f {{ repmgr_conf_file }}
  register: repmgr_paused
  become_user: "{{ postgres_user }}"
  become: yes
  delay: "{{ delay|default(omit) }}"
  

- name: Fail if repmgr pause failed
  fail:
    msg: "repmgrd could not be paused on one or more nodes."
  when:
    repmgr_paused is not successful
