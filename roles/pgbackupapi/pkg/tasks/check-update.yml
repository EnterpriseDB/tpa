- include_tasks: list-packages.yml
  vars:
    list_varname: _all_pgbapi_packages

- name: Check if we can install the desired pg-backup-api packages
  include_role:
    name: pkg/install
  vars:
    package_list_name: "pgbapi packages"
    package_list: "{{ _all_pgbapi_packages }}"
    check_install_only: yes
    result_varname: pgbapi_pkg_check

- assert:
    that: pgbapi_pkg_check is successful
    fail_msg: >
      Some packages are missing or the 'pg_backup_api_package_version' specified in 'config.yml' cannot be satisfied.

- debug:
    msg: "The desired 'pg_backup_api_package_version' or higher is already installed. PG Backup API upgrade tasks will be skipped on Barman server '{{ inventory_hostname }}'."
  when: pgbapi_pkg_check.changed is false

- set_fact:
    pg_backup_api_package_update: "{{
      pgbapi_pkg_check is defined 
      and pgbapi_pkg_check is successful
      and pgbapi_pkg_check.changed is true
    }}"
