# Add transparent_hugepage=never and hugepage reservation parameters to
# GRUB_CMDLINE_LINUX in /etc/default/grub and run grub2-mkconfig.
#
# Because it's fiddly to try to add to GRUB_CMDLINE_LINUX in place, and
# because /etc/default/grub is documented to be a shell script that is
# source'd, we can just add an extra line to it.
#
# When huge_page_size is the architecture default we reserve pages with
# "hugepages=N", which targets the default pool. When a larger size is
# requested we name the pool explicitly with "hugepagesz=X" so the
# subsequent "hugepages=N" reserves N pages of that size.

- name: Set kernel commandline in /etc/default/grub
  shell: >
    source /etc/default/grub;
    if ! [[ "$GRUB_CMDLINE_LINUX" =~ 'transparent_hugepage=' && "$GRUB_CMDLINE_LINUX" =~ 'hugepage=' ]];
    then echo 'GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX {{ _hugepage_cmdline }}"' >> /etc/default/grub;
    else echo unchanged;
    fi
  args:
    executable: /bin/bash
  register: cmdline
  changed_when: cmdline.stdout != 'unchanged'
  vars:
    _hugepage_cmdline: >-
      {%- if not _huge_page_size_is_default | bool -%}
      hugepagesz={{ _huge_page_size_kernel }} {% endif -%}
      hugepages={{ _nr_hugepages }} transparent_hugepage={{ transparent_hugepage }}
  when:
    platform not in ['docker', 'lxd']
    and target_container_type is not defined

- name: Run grub2-mkconfig
  command: grub2-mkconfig -o /boot/grub2/grub.cfg
  when:
    cmdline is changed
    and platform not in ['docker', 'lxd']
    and target_container_type is not defined
