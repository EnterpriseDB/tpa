# Handle calls to the Patroni cluster API

# The GET /cluster endpoint generates a JSON document describing the current cluster topology and state

- name: Get the Patroni cluster topology and state from the `/cluster` API
  uri:
    method: GET
    url: "{{ _patroni_api_scheme }}://{{ inventory_hostname }}:{{ patroni_listen_port }}/cluster"
    body_format: json
    url_username: "{{ (patroni_authentication_mode == 'basic') | ternary(patroni_restapi_user, omit) }}"
    url_password: "{{ (patroni_authentication_mode == 'basic') | ternary(vars['%s_password' % patroni_restapi_user], omit) }}"
    ca_path: "{{ patroni_ssl_enabled|ternary(_patroni_ssl_ca_path, omit) }}"
    client_cert: "{{ (patroni_authentication_mode == 'mtls') | ternary(patroni_ssl_cert_file, omit) }}"
    client_key: "{{ (patroni_authentication_mode == 'mtls') | ternary(patroni_ssl_key_file, omit) }}"

    # This is needed to avoid blocking API calls in case there is a
    # proxy, e.g. for downloading packages
    use_proxy: no

  # mTLS reads patroni_ssl_key_file, owned by postgres_user and mode 0600;
  # the play calling this task (e.g. tpaexec test) may not run as root.
  become: yes

  register: patroni_cluster_api_output
