- assert:
    msg: "Please define a list of haproxy_backend_servers to use haproxy"
    that:
      - haproxy_backend_servers is defined

- name: Create ssl-dh-param-file
  openssl_dhparam:
    path: /etc/ssl/dhparams.pem
    size: "{{ ha_proxy_dhparams_key_size }}"
    owner: root
    group: root
    mode: "0644"

# If Patroni REST API requires a client certificate and key, let's generate one for the
# HAProxy agent.
- include_tasks: ssl.yml
  when:
    - failover_manager == 'patroni'
    - patroni_authentication_mode == 'mtls'

# After 'ssl.yml' runs, we are able to properly set check-ssl in HAProxy configuration.
# If Patroni was set up with mTLS, we need to verify the server certificate with our CA,
# and to send our client certificate and key. Otherwise we just rely on the server.
- name: Ensure check-ssl is set in haproxy_server_options if required
  set_fact:
    haproxy_server_options: "{{
        hostvars[item].haproxy_server_options|union(
          ['check-ssl', _check_ssl_options]|flatten
        )
      }}"
  with_items: "{{ haproxy_backend_servers }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  when:
    - failover_manager == 'patroni'
    - patroni_ssl_enabled
    - "'check-ssl' not in hostvars[item].haproxy_server_options|join(' ')"
  vars:
    # SSL options for the HAProxy backend server.
    # When the Patroni REST API server is running with SSL enabled, we need to configure
    # HAProxy to establish a HTTPS connection for performing health checks.
    #
    # If Patroni was configured with mTLS, we also need to provide the client certificate
    # and key to HAProxy, so that it can authenticate to the Patroni REST API server.
    #
    # Otherwise, we simply need to provide the CA certificate to verify the server
    # certificate. In this case, we can use 'ssl_ca_file'. As 'patroni_ssl_enabled' is
    # true (given the 'when' condition above), 'ssl_ca_file' will be surely set -- see
    # roles/sys/ssl/tasks/main.yml
    _check_ssl_options: >-
      {%- if hostvars[item].patroni_authentication_mode == 'mtls' -%}
      check-ssl verify required ca-file {{ haproxy_ssl_ca_file }} crt {{ haproxy_ssl_cert_combined_file }}
      {%- else -%}
      check-ssl verify required ca-file {{ ssl_ca_file }}
      {%- endif -%}

- name: Install haproxy.cfg
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
  notify:
    - Note haproxy reload required

# on Debian or Ubuntu, the haproxy package may already have installed
# this file, but we will overwrite it
- name: Install rsyslog configuration for haproxy
  copy:
    src: 49-haproxy.conf
    dest: /etc/rsyslog.d/
    owner: root
    group: root
    mode: "0644"
  register: haproxy_syslog_conf

- name: Restart rsyslog
  service:
    name: rsyslog
    state: restarted
  when: haproxy_syslog_conf is changed

- name: Install agent.lua
  template:
    src: agent.lua.j2
    dest: /etc/haproxy/agent.lua
  notify:
    - Note haproxy reload required
  when:
    haproxy_backend_queue_check != 'none'

- include_role: name=postgres/createuser
  vars:
    username: haproxy
    role_attrs: [nologin]
    conn_limit: "{{ (compliance|default('') == 'stig')|ternary(groups['role_haproxy']|count, null) }}"

  when:
    haproxy_backend_queue_check != 'platypus'

- block:
  - name: Install check-queue
    template:
      src: check-queue.j2
      dest: /etc/haproxy/check-queue
      mode: "0755"
    notify:
      - Note haproxy reload required

  - include_role: name=postgres/createuser
    vars:
      username: check_queue
      granted_roles:
      - bdr_application

  - include_role:
      name: postgres/pgpass
    vars:
      pgpassfile: /etc/haproxy/.pgpass
      pgpass_owner: root
      pgpass_group: root
      pgpass_users:
      - check_queue
  when:
    haproxy_backend_queue_check == 'check-queue'

- name: Check whether {{ socket_dir }} exists
  stat:
    path: "{{ socket_dir }}"
  register: haproxy_stats_socket_dir
  vars:
    socket_dir: "{{ haproxy_stats_socket|dirname }}"

- name: Create {{ socket_dir }}
  file:
    path: "{{ socket_dir }}"
    state: directory
    owner: haproxy
    group: haproxy
    mode: "0755"
  when: not haproxy_stats_socket_dir.stat.exists
  vars:
    socket_dir: "{{ haproxy_stats_socket|dirname }}"

- name: Allow haproxy to connect to arbitrary backends
  seboolean:
    name: haproxy_connect_any
    state: yes
    persistent: yes
  ignore_errors: true

- name: Enable haproxy service
  service:
    name: haproxy
    enabled: yes
