haproxy_read_only_load_balancer_enabled: no

use_ssl_cert_authentication: no

haproxy_ssl_service: haproxy
haproxy_ssl_dir: "/etc/tpa/{{ haproxy_ssl_service }}"
haproxy_local_ssl_dir: "{{
  use_ssl_cert_authentication|
   ternary(cluster_dir ~ '/ssl', cluster_dir ~ '/ssl/haproxy') }}"
