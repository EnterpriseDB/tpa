# Set SSL certificate facts for Patroni API calls
# These facts were set during deploy but are not persisted across playbook runs
- name: Include patroni/config defaults to get SSL directory paths
  include_vars:
    file: "{{ tpa_dir }}/roles/patroni/config/defaults/main.yml"

- name: Set Patroni SSL certificate facts
  set_fact:
    patroni_ssl_ca_file: "{{ patroni_ssl_dir }}/root.crt"
    patroni_ssl_cert_file: "{{ patroni_ssl_dir }}/{{ patroni_ssl_service }}.crt"
    patroni_ssl_key_file: "{{ patroni_ssl_dir }}/{{ patroni_ssl_service }}.key"
  when: patroni_ssl_enabled or patroni_authentication_mode == 'mtls'

- name: Get current patroni cluster health
  include_role:
    name: patroni/api
    tasks_from: health

- include_tasks: output.yml
  vars:
    output_file: patroni-node-health.json
    content: |
      {{ patroni_health_api_output.json }}

- name: Get current patroni node liveness
  include_role:
    name: patroni/api
    tasks_from: liveness

- name: Get current patroni node readiness
  include_role:
    name: patroni/api
    tasks_from: readiness

- name: Fail if any of the above tasks failed
  fail:
    msg: "patroni node health/liveness/readiness failed (use -e exclude=fail to skip)"
  when:
    patroni_health_api_output is not successful
    or patroni_liveness_api_output is not successful
    or patroni_readiness_api_output is not successful
    and task_selector|permits('fail')

- name: Get current patroni cluster topology
  include_role:
    name: patroni/api
    tasks_from: cluster

- include_tasks: output.yml
  vars:
    output_file: patroni-cluster.json
    content: |
      {{ patroni_cluster_api_output.json }}
