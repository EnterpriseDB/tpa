# Basic tests that can be safely run to determine if a M1 efm cluster is in
# a working state. this can be reused for initial health check before any
# maintenance operation is run on the cluster.

# This is a task file, not a role, so efm/config's defaults are not loaded
# automatically. We include them explicitly to make the retry vars
# (efm_cluster_status_retries, efm_cluster_status_retry_delay) and
# efm_bind_by_hostname available for the tasks below. We only fall back
# to the role defaults for variables that are not already defined, so a
# user-configured efm_bind_by_hostname (e.g. from group_vars) is not
# clobbered by the role defaults. See TPA-1648.
- name: Include EFM config defaults
  include_vars:
    name: _efm_config_defaults
    file: "{{ tpa_dir }}/roles/efm/config/defaults/main.yml"

- name: Apply EFM config defaults for variables not already defined
  set_fact:
    efm_bind_by_hostname: "{{ efm_bind_by_hostname|default(_efm_config_defaults.efm_bind_by_hostname) }}"
    efm_cluster_status_retries: "{{ efm_cluster_status_retries|default(_efm_config_defaults.efm_cluster_status_retries) }}"
    efm_cluster_status_retry_delay: "{{ efm_cluster_status_retry_delay|default(_efm_config_defaults.efm_cluster_status_retry_delay) }}"

- name: Ensure we use efm failover_manager
  assert:
    that:
      failover_manager == 'efm'
    fail_msg:
      These tests should only be run on EFM enabled clusters
      expected failover_manager == 'efm', got failover_manager == '{{ failover_manager }}'
    success_msg:
      Cluster is using efm as failover_manager

- name: EFM nodes only
  when: >
    'efm' in role
  block:
  - name: Ensure efm_bind_by_hostname is handled
    set_fact:
      efm_identity: "{{ (efm_bind_by_hostname|default(false))|ternary(inventory_hostname, ip_address) }}"

  - name: Run efm cluster-status command and wait for nodes to sync
    command: >
      {{ efm_bin_dir }}/efm cluster-status-json {{ cluster_name }}
    changed_when: false
    become: true
    become_user: efm
    register: efm_cluster_status_json
    retries: "{{ efm_cluster_status_retries }}"
    delay: "{{ efm_cluster_status_retry_delay }}"
    until: >
      efm_cluster_status_json is success and
      (sync_values|unique|length) == 1
    vars:
      efm_cluster_info: "{{ efm_cluster_status_json.stdout|from_json }}"
      query: "{{ efm_version is version('5', '>=') | ternary('nodes.*.lsn', 'nodes.*.xlog') }}"
      sync_values: "{{ efm_cluster_info|json_query(query) }}"


  - name: Format output
    set_fact:
      efm_cluster_info: "{{ efm_cluster_status_json.stdout|from_json }}"
    when: >
      'efm' in role

  - name: Ensure no nodes are reported as missing
    assert:
      that: >
        not efm_cluster_info.missingnodes
      fail_msg: >
        One or more nodes are reported missing: {{ efm_cluster_info.missingnodes }}
      success_msg: >
        All nodes could be reached.

  - name: Ensure failover priority list is not empty
    assert:
      that: >
        efm_cluster_info.failoverpriority
      fail_msg: >
        Failover priority list is empty.
      success_msg: >
        Failover priority list is defined as: {{ efm_cluster_info.failoverpriority }}


  - name: Ensure node is part of allowed nodes
    assert:
      that:
        efm_identity in efm_cluster_info.allowednodes
      fail_msg: >
        Node {{ inventory_hostname }} was not found in allowed nodes list
        expected to find {{ efm_identity }} in {{ efm_cluster_info.allowednodes }}
      success_msg: >
        {{ efm_identity }} ({{ inventory_hostname }}) is part of allowed nodes list.

