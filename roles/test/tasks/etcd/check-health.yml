- name: Include etcd/facts to ensure etcdctl_options is defined
  include_role:
    name: etcd/facts

- name: Check etcd cluster health
  command:
    etcdctl {{ etcdctl_options }} endpoint health
  environment:
    ETCDCTL_API: 3
  register: etcd_health_check

- assert:
    msg: >
      etcd reported an unhealthy state for the cluster. Ensure cluster is in a healthy state before making any changes.
      Also ensure the version of etcd in use supports the v3 API. Manual upgrade is required until this requirement is met.
    that: etcd_health_check.rc == 0
