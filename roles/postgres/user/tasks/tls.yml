- name: Check if TPA TLS certificate already exists
  stat:
    path: "/etc/tpa/{{ cluster_name }}.crt"
  register: tpa_tls_certificate

- name: Generate self-signed TLS key and certificate
  shell: >
    umask 077 &&
    /bin/echo -e "--\nState\nCity\nOrganization\nOrganizationalUnit\nlocalhost.localdomain\nroot@localhost.localdomain\n" |
    /usr/bin/openssl req -newkey rsa:{{ postgres_rsa_key_size }} -keyout "{{ cluster_name }}.key" -nodes -x509 -days {{ openssl_certificate_validity }} -out "{{ cluster_name }}.crt"
  args:
    chdir: /etc/tpa
    executable: /bin/bash
  when: >
    tpa_tls_renew_tls_certificates|default(false)
    or (not tpa_tls_certificate.stat.exists)
  notify:
    - Note Postgres restart required

- name: Set correct ownership and mode on ~/.postgresql
  file:
    path: "~{{ postgres_user }}/.postgresql"
    owner: "{{ postgres_user }}"
    group: "{{ postgres_group }}"
    state: directory
    mode: "0700"

- name: Retrieve list of key/certificate files
  shell: >
    find /etc/tpa -maxdepth 1 \( -name '*.crt' -o -name '*.key' \) &&
    find ~{{ postgres_user }}/.postgresql -name '*.crt' -o -name '*.key'
  args:
    executable: /bin/bash
  register: keycertfiles
  changed_when: false
  check_mode: no

- name: Set correct ownership and mode on key/certificate files
  file:
    path: "{{ item }}"
    owner: "{{ postgres_user }}"
    group: "{{ postgres_group }}"
    mode: "0600"
  with_items: "{{ keycertfiles.stdout_lines }}"
