# We assume that a key named x in bdr_node_groups[*].options corresponds
# to the bdr.node_group_summary.x column in the database. If this is not
# the case, we may unnecessarily repeat calls to this function.

- name: Alter options for BDR node group {{ node_group.name }}
  include_tasks: alter_node_group_option.yml
  vars:
    node_group_name: "{{ node_group.name }}"
    config_key: "{{ option.key }}"
    config_value: "{{ option.value }}"
    catalog_key: "{{ option.key }}"
    this_group_facts:
      "{{ bdr_database_facts.bdr.node_group_summary
          |selectattr('node_group_name', 'equalto', node_group.name)
          |list }}"
    # Connection Manager reads these options from the group that has routing
    # enabled. Clusters configured before TPA-1622 have them on the top-level
    # group even under local routing, where they have no effect, so a
    # routing-enabled subgroup falls back to its parent's values.
    _cm_option_names:
      ['read_write_port', 'read_only_port', 'http_port', 'use_https']
    _parent_options:
      "{{ (bdr_node_groups|default([]))
          |selectattr('name', 'equalto', node_group.parent_group_name|default(''))
          |map(attribute='options')|list|first|default({}, true) }}"
    _inherited_options:
      "{{ _parent_options|extract_keys(_cm_option_names)
          if node_group.options|default({})|try_subkey('enable_routing', true)|bool
          else {} }}"
  with_dict:
    "{{ _inherited_options|combine(node_group.options|default({})) }}"
  loop_control:
    loop_var: option
    label: >
      {{ node_group.name }}:{{ option.key }}:{{ option.value }}
  when:
    # Some options are handled later in post-join.yml
    - option.key not in ["enable_raft", "enable_routing", "default_commit_scope"]
    - this_group_facts is empty
      or catalog_key not in this_group_facts[0]
      or this_group_facts[0][catalog_key] != option.value
