- include_tasks: list-packages.yml
  vars:
    list_varname: _all_pgbouncer_packages

- name: Check if we can install the desired PgBouncer packages
  include_role:
    name: pkg/install
  vars:
    package_list_name: "pgbouncer packages"
    package_list: "{{ _all_pgbouncer_packages }}"
    check_install_only: yes
    result_varname: pgbouncer_pkg_check

- assert:
    that: pgbouncer_pkg_check is successful
    fail_msg: >
      Some packages are missing or the 'pgbouncer_package_version' specified in 'config.yml' cannot be satisfied.

- debug:
    msg: "The desired 'pgbouncer_package_version' or higher is already installed. PgBouncer upgrade tasks will be skipped on '{{ inventory_hostname }}'."
  when: 
  - pgbouncer_pkg_check is successful
  - pgbouncer_pkg_check.changed is false

- set_fact:
    pgbouncer_package_update: "{{
      pgbouncer_pkg_check is defined 
      and pgbouncer_pkg_check is successful 
      and pgbouncer_pkg_check.changed is true
    }}"